<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вакансия Python-разработчик в Москве</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "JobPosting",
    "title": "Python-разработчик",
    "hiringOrganization": {"@type": "Organization", "name": "Рога и Копыта"},
    "employmentType": "FULL_TIME",
    "description": "<p>Мы ищем Python-разработчика в команду внутренних сервисов. Предстоит развивать API на FastAPI, проектировать схемы данных в PostgreSQL, писать понятный и тестируемый код. Гибридный график, ДМС и обучение за счёт компании.</p>"
  }
  </script>
  <template id="HH-Lux-InitialState">
  {
    "vacancyView": {
      "name": "Python-разработчик",
      "company": {"name": "Рога и Копыта"},
      "area": {"name": "Москва"},
      "compensation": {"from": 250000, "to": 320000, "currencyCode": "RUR"},
      "description": "<p>Мы ищем Python-разработчика в команду внутренних сервисов.</p>"
    }
  }
  </template>
</head>
<body>
  <h1 data-qa="vacancy-title">Python-разработчик</h1>
  <span data-qa="vacancy-company-name">Рога и Копыта</span>
  <p data-qa="vacancy-view-location">Москва</p>
  <div data-qa="vacancy-description">
    <p>Мы ищем Python-разработчика в команду внутренних сервисов.</p>
  </div>
</body>
</html>
